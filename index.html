<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Mushroom Lab</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
<style>
body { font-family: system-ui, sans-serif; margin: 2rem; background: #111; color: #eee; }
h1 { font-weight: 500; }
.cards { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 2rem; }
.card { background: #1c1c1c; padding: 1rem 1.5rem; border-radius: 8px; }
.label { font-size: 0.8rem; color: #999; }
.value { font-size: 1.6rem; }
canvas { background: #1c1c1c; border-radius: 8px; padding: 1rem; margin-bottom: 1.5rem; }
.updated { color: #777; font-size: 0.8rem; }
</style>
</head>
<body>
<h1>Mushroom Lab</h1>
<div class="cards">
  <div class="card"><div class="label">CO2</div><div class="value">-- ppm</div></div>
  <div class="card"><div class="label">Temperature</div><div class="value">-- &deg;C</div></div>
  <div class="card"><div class="label">Humidity</div><div class="value">-- %</div></div>
</div>
<canvas id="co2"></canvas>
<canvas id="temp"></canvas>
<canvas id="rh"></canvas>
<p class="updated">Updated 21 Sep 2026, 17:00</p>
<script>
const data = {'co2': [], 'temp': [], 'rh': []};
function chart(id, label, colour) {
  new Chart(document.getElementById(id), {
    type: 'line',
    data: { datasets: [{
      label: label,
      data: data[id].map(p => ({x: p[0], y: p[1]})),
      borderColor: colour, tension: 0.3, pointRadius: 0
    }] },
    options: {
      scales: { x: { type: 'time', time: { unit: 'hour' }, ticks: { color: '#888' } },
                 y: { ticks: { color: '#888' } } },
      plugins: { legend: { labels: { color: '#ccc' } } }
    }
  });
}
chart('co2', 'CO2 (ppm)', '#7dd3fc');
chart('temp', 'Temperature (C)', '#fca5a5');
chart('rh', 'Humidity (%)', '#86efac');
</script>
</body>
</html>
